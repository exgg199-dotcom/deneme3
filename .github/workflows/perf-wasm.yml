name: perf-wasm
# The site consumes this reader bundle from horizon-rust/horizon-site.
on:
  push:
    branches: [main]
    paths:
      - 'crates/horizon-perf/**'
      - 'crates/horizon-perf-format/**'
      - 'crates/horizon-bench/**'
      - 'xtask/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.github/workflows/perf-wasm.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'crates/horizon-perf/**'
      - 'crates/horizon-perf-format/**'
      - 'crates/horizon-bench/**'
      - 'xtask/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.github/workflows/perf-wasm.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-wasm-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Website reader artifacts are published by upstream, not the mobile app fork.
    if: github.repository == 'horizon-rust/horizon'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HORIZON_TELEMETRY_URL: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable, 2026-11
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      # Pull requests read main's cache and save none: ten pull requests' caches (~300 MB each) filled the
      # repository's 10 GB and pushed main's own caches out (2026-11-14).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: perf-wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The agreement test: the C ABI, called natively, must print the bytes the CLI prints.
      - name: The wasm ABI agrees with the CLI
        run: cargo test -p horizon-perf --features wasm --test wasm
      - name: Build the wasm the page loads
        run: cargo run -p xtask -- perf-wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-wasm
          path: target/perf-wasm
          if-no-files-found: error
