self-hosted-runner:
  # The Mac mini's runner (ludovics-mac-mini), which holds the maintainer's own Minecraft files.
  # windows-11-vs2026-arm is GitHub's Windows ARM64 image (2026-08), newer than actionlint's label list.
  # Blacksmith's runners (docs/ci-runners.md), every size.
  labels: [horizon-game, ludovics-mac-mini, windows-11-vs2026-arm, "blacksmith-*vcpu-ubuntu-*"]

paths:
  .github/workflows/ios.yml:
    ignore:
      # GitHub supports concurrency.queue; actionlint 1.7.12 does not (rhysd/actionlint#657).
      - '^unexpected key "queue" for "concurrency" section\.'
